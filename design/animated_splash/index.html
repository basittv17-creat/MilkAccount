<!doctype html><html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milk Account Animated Splash</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap');
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Nunito,"Noto Naskh Arabic",sans-serif;color:#073b86;background:#e8f8ff}
.stage{height:100%;max-width:520px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,white,#dff5ff 70%,#fff7e8)}
.sun{position:absolute;right:8%;top:12%;width:100px;height:100px;border-radius:50%;background:#fff2bf;box-shadow:0 0 55px #ffe99a}
.cloud{position:absolute;width:125px;height:27px;background:#fff;border-radius:40px;opacity:.8;animation:cloud 18s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:55px;height:48px;left:22px;bottom:0}.cloud:after{width:62px;height:56px;left:61px;bottom:0}.c1{top:25%;left:-10%}.c2{top:34%;right:-12%;animation-direction:reverse}
.brand{position:absolute;top:4%;width:100%;text-align:center;z-index:5}.urdu{font-family:"Noto Naskh Arabic",serif;font-size:clamp(37px,8vw,50px);font-weight:800;line-height:1.4}.line{height:4px;width:48%;margin:2px auto;background:#e8b83e;border-radius:50%}.en{font-size:15px;font-weight:900;letter-spacing:5px;margin-top:7px}
.hill{position:absolute;bottom:32%;left:-15%;width:130%;height:38%;border-radius:50% 50% 0 0;background:linear-gradient(#c7ed9a,#45aa61)}.barn{position:absolute;right:5%;bottom:51%;width:22%;height:12%;background:#d99c58;clip-path:polygon(0 28%,50% 0,100% 28%,100% 100%,0 100%)}
.animals{position:absolute;bottom:39%;height:28%;width:100%;z-index:3}.animal{position:absolute;width:53%;filter:drop-shadow(0 7px 4px #235d3955)}.cow{left:-60%;top:0;animation:run 7s linear infinite}.buff{left:-65%;top:42%;width:48%;animation:run 7s linear 1s infinite}.leg{transform-box:fill-box;transform-origin:top;animation:legs .2s alternate infinite}.leg2{animation-delay:-.1s}
.pour{position:absolute;z-index:4;right:2%;bottom:30%;width:47%;height:33%}.stream{stroke-dasharray:10 7;animation:flow .35s linear infinite}.milk{transform-origin:bottom;animation:fill 5s ease-in-out infinite}.splash{animation:splash .7s alternate infinite}
.badge{position:absolute;z-index:5;bottom:20%;left:50%;transform:translateX(-50%);width:105px;height:105px;border-radius:32px;background:linear-gradient(145deg,#10aaff,#0649a9);border:5px solid white;box-shadow:0 7px #e8b83e,0 12px 25px #073b8655;display:grid;place-items:center;color:white;font-size:53px}
.tag{position:absolute;z-index:6;bottom:12.5%;width:100%;text-align:center;font-family:"Noto Naskh Arabic",serif;font-size:clamp(24px,5.8vw,32px);font-weight:800}.sub{position:absolute;z-index:6;bottom:9.5%;width:100%;text-align:center;font-size:11px;font-weight:900;letter-spacing:.7px}
.load{position:absolute;z-index:8;bottom:2.5%;left:9%;width:82%}.track{height:10px;background:#d7e4ee;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#087be8,#12c7b7);border-radius:20px;animation:loading 4s ease-in-out infinite}.loadtxt{text-align:center;font-family:"Noto Naskh Arabic",serif;font-size:17px;font-weight:700;margin-top:7px}
@keyframes run{0%{transform:translateX(0) translateY(0)}12%{transform:translateX(45vw) translateY(-5px)}30%{transform:translateX(112vw)}31%{transform:translateX(-70%)}70%{transform:translateX(85vw) translateY(-4px)}100%{transform:translateX(150vw)}}@keyframes legs{to{rotate:24deg}}@keyframes flow{to{stroke-dashoffset:-34}}@keyframes fill{0%,12%{transform:scaleY(.06)}85%,100%{transform:scaleY(.84)}}@keyframes splash{to{transform:translateY(-7px)}}@keyframes loading{0%{width:8%}65%{width:76%}100%{width:94%}}@keyframes cloud{to{transform:translateX(55px)}}
@media(max-height:650px){.brand{top:0}.animals{bottom:35%;height:26%}.pour{bottom:27%}.badge{bottom:16%;width:82px;height:82px}.tag{bottom:9%;font-size:23px}.sub{bottom:6.5%}.load{bottom:0}}
</style></head><body><main class="stage">
