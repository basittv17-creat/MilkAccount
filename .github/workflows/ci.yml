name: Milk Account CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android and Web platform files
        run: bash tool/prepare_platforms.sh
      - name: Install dependencies
        run: flutter pub get
      # telephony_sms 0.1.0 pins AGP 9.3.1, which triggers an Android
      # library source-set ClassCastException. AGP 9.1.1 avoids that regression.
      - name: Use compatible Android Gradle Plugin for telephony_sms
        run: |
          PLUGIN_GRADLE="$(find "$HOME/.pub-cache" -path '*/telephony_sms-0.1.0/android/build.gradle.kts' -print -quit)"
          if [[ -z "$PLUGIN_GRADLE" ]]; then
            echo "Could not locate telephony_sms 0.1.0 Android Gradle file" >&2
            exit 1
          fi
          grep -q 'com.android.tools.build:gradle:9.3.1' "$PLUGIN_GRADLE"
          sed -i 's/com.android.tools.build:gradle:9.3.1/com.android.tools.build:gradle:9.1.1/' "$PLUGIN_GRADLE"
          grep -q 'com.android.tools.build:gradle:9.1.1' "$PLUGIN_GRADLE"
      - name: Format Dart source
        run: dart format .
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      - name: Install APK and check startup on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -e
            mkdir -p artifacts
            trap 'adb logcat -d -v threadtime > artifacts/emulator-logcat.txt 2>&1 || true' EXIT
            adb logcat -c
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb shell monkey -p com.awasigogera.milkaccount -c android.intent.category.LAUNCHER 1
            sleep 30
            adb logcat -d -v threadtime > artifacts/emulator-logcat.txt
            if grep -E -i 'FATAL EXCEPTION|Fatal signal [0-9]+|am_crash|ANR in ' artifacts/emulator-logcat.txt; then
              echo "App crash or ANR detected in Android emulator." >&2
              exit 1
            fi
            if ! adb shell pidof com.awasigogera.milkaccount >/dev/null; then
              echo "App process is not running after startup; see emulator-logcat.txt." >&2
              exit 1
            fi
      - name: Upload emulator crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milk-account-emulator-crash-logs
          path: artifacts/emulator-logcat.txt
          if-no-files-found: warn
      - name: Build Web
        run: flutter build web --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: milk-account-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: milk-account-web-build
          path: build/web/
          if-no-files-found: error
