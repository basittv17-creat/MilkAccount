name: Milk Account CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Give every run its own concurrency group: new runs never cancel older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android and Web platform files
        run: bash tool/prepare_platforms.sh
      - name: Install dependencies
        run: flutter pub get
      # telephony_sms 0.1.0 pins AGP 9.3.1, which triggers an Android
      # library source-set ClassCastException. AGP 9.1.1 avoids that regression.
      - name: Use compatible Android Gradle Plugin for telephony_sms
        run: |
          PLUGIN_GRADLE="$(find "$HOME/.pub-cache" -path '*/telephony_sms-0.1.0/android/build.gradle.kts' -print -quit)"
          if [[ -z "$PLUGIN_GRADLE" ]]; then
            echo "Could not locate telephony_sms 0.1.0 Android Gradle file" >&2
            exit 1
          fi
          grep -q 'com.android.tools.build:gradle:9.3.1' "$PLUGIN_GRADLE"
          sed -i 's/com.android.tools.build:gradle:9.3.1/com.android.tools.build:gradle:9.1.1/' "$PLUGIN_GRADLE"
          grep -q 'com.android.tools.build:gradle:9.1.1' "$PLUGIN_GRADLE"
      - name: Format Dart source
        run: dart format .
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Simulate two-device offline transfer protocol
        run: flutter test test/transfer_packet_test.dart
      - name: Build Android APK
        run: flutter build apk --release
      # The release build installs a large NDK and CMake toolchain. They are
      # no longer needed once the APK exists; remove them and Gradle caches so
      # the emulator system image can be installed without exhausting runner disk.
      - name: Free disk space for Android emulator
        run: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf "$ANDROID_SDK/ndk" "$ANDROID_SDK/cmake"
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/daemon"
          echo "Disk space after cleanup:"
          df -h /
      # Keep placeholder text files so diagnostics are still uploaded if the
      # emulator cannot boot; the emulator script replaces them with real logs.
      - name: Prepare Android diagnostics files
        run: |
          mkdir -p artifacts
          : > artifacts/android-logcat.txt
          : > artifacts/fatal-logs.txt
          : > artifacts/app-exit-info.txt
          : > artifacts/emulator-check-status.txt
      # GitHub-hosted Linux runners expose KVM, but the runner user needs
      # the udev rule before android-emulator-runner can detect hardware acceleration.
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install APK and check startup on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          # The action runs each script line in a separate shell. Keep stateful
          # variables, functions and the EXIT trap inside one checked-in script.
          script: bash tool/check_android_emulator.sh
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milk-account-fatal-crash-logs
          path: artifacts/*.txt
          if-no-files-found: warn
      - name: Build Web
        run: flutter build web --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: milk-account-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: milk-account-web-build
          path: build/web/
          if-no-files-found: error
