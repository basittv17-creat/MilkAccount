name: Milk Account CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Give every run its own concurrency group: new runs never cancel older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android and Web platform files
        run: bash tool/prepare_platforms.sh
      - name: Install dependencies
        run: flutter pub get
      # telephony_sms 0.1.0 pins AGP 9.3.1, which triggers an Android
      # library source-set ClassCastException. AGP 9.1.1 avoids that regression.
      - name: Use compatible Android Gradle Plugin for telephony_sms
        run: |
          PLUGIN_GRADLE="$(find "$HOME/.pub-cache" -path '*/telephony_sms-0.1.0/android/build.gradle.kts' -print -quit)"
          if [[ -z "$PLUGIN_GRADLE" ]]; then
            echo "Could not locate telephony_sms 0.1.0 Android Gradle file" >&2
            exit 1
          fi
          grep -q 'com.android.tools.build:gradle:9.3.1' "$PLUGIN_GRADLE"
          sed -i 's/com.android.tools.build:gradle:9.3.1/com.android.tools.build:gradle:9.1.1/' "$PLUGIN_GRADLE"
          grep -q 'com.android.tools.build:gradle:9.1.1' "$PLUGIN_GRADLE"
      - name: Format Dart source
        run: dart format .
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release
      # The release build installs a large NDK and CMake toolchain. They are
      # no longer needed once the APK exists; remove them and Gradle caches so
      # the emulator system image can be installed without exhausting runner disk.
      - name: Free disk space for Android emulator
        run: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf "$ANDROID_SDK/ndk" "$ANDROID_SDK/cmake"
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/daemon"
          echo "Disk space after cleanup:"
          df -h /
      # Create a valid diagnostics archive before emulator setup. If the
      # emulator action itself fails before running its script, the artifact
      # still exists and clearly contains an empty fatal-log file.
      - name: Prepare fatal crash logs archive
        run: |
          mkdir -p artifacts
          : > artifacts/fatal-logs.txt
          zip -j -q artifacts/fatal-crash-logs.zip artifacts/fatal-logs.txt
          rm artifacts/fatal-logs.txt
      - name: Install APK and check startup on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -e
            mkdir -p artifacts
            RAW_LOG="/tmp/milk-account-emulator-logcat.txt"
            FATAL_LOG="artifacts/fatal-logs.txt"
            FATAL_ZIP="artifacts/fatal-crash-logs.zip"
            : > "$FATAL_LOG"
            collect_fatal_logs() {
              adb logcat -d -v threadtime > "$RAW_LOG" 2>&1 || true
              grep -E -i -B 5 -A 40 "FATAL EXCEPTION|Fatal signal [0-9]+|am_crash|ANR in " "$RAW_LOG" > "$FATAL_LOG" || true
              if [[ -s "$FATAL_LOG" ]]; then
                zip -j -q "$FATAL_ZIP" "$FATAL_LOG"
              else
                # Keep a valid, empty diagnostics archive when no fatal event occurred.
                zip -j -q "$FATAL_ZIP" "$FATAL_LOG"
              fi
              rm -f "$RAW_LOG"
            }
            trap collect_fatal_logs EXIT
            adb logcat -c
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb shell monkey -p com.awasigogera.milkaccount -c android.intent.category.LAUNCHER 1
            echo "Keeping the app running in the emulator for 4 minutes..."
            sleep 240
            if grep -q -E -i 'FATAL EXCEPTION|Fatal signal [0-9]+|am_crash|ANR in ' <(adb logcat -d -v threadtime); then
              echo "Fatal crash or ANR detected. See the fatal crash ZIP artifact." >&2
              exit 1
            fi
            if ! adb shell pidof com.awasigogera.milkaccount >/dev/null; then
              echo "App process is not running after the 4-minute emulator test." >&2
              exit 1
            fi
      - name: Upload fatal crash logs ZIP only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milk-account-fatal-crash-logs
          path: artifacts/fatal-crash-logs.zip
          if-no-files-found: warn
      - name: Build Web
        run: flutter build web --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: milk-account-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: milk-account-web-build
          path: build/web/
          if-no-files-found: error
