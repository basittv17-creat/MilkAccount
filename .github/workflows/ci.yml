name: Milk Account CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Give every run its own concurrency group: new runs never cancel older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21 for Android Gradle builds
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android and Web platform files
        run: bash tool/prepare_platforms.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Normalize launcher icon PNG and generate Android icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("assets/app_icon.png")
          image = Image.open(source).convert("RGBA")
          image.save(source, format="PNG", optimize=True)
          Image.open(source).load()
          print("Launcher icon normalized to a validated RGBA PNG.")
          PY
          dart run flutter_launcher_icons
      - name: Format Dart source
        run: dart format .
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test --concurrency=1
      - name: Simulate two-device offline transfer protocol
        run: flutter test test/transfer_packet_test.dart
      - name: Build Android APK
        run: flutter build apk --release
      - name: Verify Android package, target API, and restricted SMS permission
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [[ -z "$AAPT" ]]; then
            echo "Android aapt tool was not found." >&2
            exit 1
          fi
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -Fq "package: name='com.awasigogera.milkaccount'" <<< "$BADGING"
          grep -Fq "versionCode='4'" <<< "$BADGING"
          grep -Fq "targetSdkVersion:'36'" <<< "$BADGING"
          PERMISSIONS="$("$AAPT" dump permissions "$APK")"
          if grep -q 'android.permission.SEND_SMS' <<< "$PERMISSIONS"; then
            echo "Restricted SEND_SMS permission must not be present." >&2
            exit 1
          fi
      - name: Configure private Play upload-key signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is missing." >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD secret is missing." >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS secret is missing." >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD secret is missing." >&2; exit 1; }

          KEYSTORE_FILE="android/app/upload-keystore.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          source = path.read_text()
          debug_line = 'signingConfig = signingConfigs.getByName("debug")'
          if source.count(debug_line) != 1:
              raise SystemExit("Expected exactly one release debug-signing line; refusing unsafe Gradle edit.")
          if source.count("    buildTypes {") != 1:
              raise SystemExit("Could not uniquely locate Android buildTypes block; refusing unsafe Gradle edit.")

          signing = """    signingConfigs {
                  create("release") {
                      storeFile = file("upload-keystore.p12")
                      storeType = "PKCS12"
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

          """
          source = source.replace("    buildTypes {", signing + "    buildTypes {", 1)
          source = source.replace(debug_line, 'signingConfig = signingConfigs.getByName("release")', 1)
          path.write_text(source)
          PY

          grep -Fq 'signingConfig = signingConfigs.getByName("release")' android/app/build.gradle.kts
          echo "Private upload keystore validated and release signing configured."
      - name: Build Android App Bundle
        run: flutter build appbundle --release
      - name: Verify App Bundle signature
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          keytool -printcert -jarfile "$AAB" >/dev/null
          echo "App Bundle signature verification passed."
      - name: Build Web
        run: flutter build web --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: milk-account-android-apk-test
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: milk-account-android-aab-signed
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: milk-account-web-build
          path: build/web/
          if-no-files-found: error
